[project]
name = "debugsql-backend"
version = "0.1.0"
description = "FastAPI backend for DebugSQL."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.40",
  "psycopg[binary]==3.2.9",
  "alembic==1.15.2",
  "openai==2.28.0",
  "google-genai==1.30.0",
  "pyyaml==6.0.2",
  "sqlglot==27.28.0",
  "numpy==2.2.6",
  "pillow==11.2.1",
  "open-clip-torch==2.32.0",
  "sentence-transformers==4.1.0",
  "torch==2.7.1",
  "torchvision==0.22.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "ruff==0.11.8",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Avoid Windows PermissionError from stale pytest cache directories.
addopts = "-p no:cacheprovider --basetemp=../.pytest_tmp"
