services:
  postgres:
    image: postgres:16-alpine
    container_name: debugsql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-debugsql}
      POSTGRES_USER: ${POSTGRES_USER:-debugsql}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-debugsql_dev_password}
    expose:
      - "5432"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-debugsql} -d ${POSTGRES_DB:-debugsql}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: debugsql-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://debugsql:debugsql_dev_password@postgres:5432/debugsql}
      DEBUGSQL_AUTO_LOGIN: ${DEBUGSQL_AUTO_LOGIN:-1}
      NL2IR_PROVIDER: ${NL2IR_PROVIDER:-stub}
      BENCHMARK_DATA_DIR: ${BENCHMARK_DATA_DIR:-/app/data/benchmarks}
      MULTIMODAL_DATA_DIR: ${MULTIMODAL_DATA_DIR:-/app/data/multimodal_demo}
      SEMANTIC_INDEX_DIR: ${SEMANTIC_INDEX_DIR:-/app/data/indexes}
      CRAIGSLIST_EVALUATION_DIR: ${CRAIGSLIST_EVALUATION_DIR:-/app/data/evaluation/craigslist}
      HF_HOME: ${HF_HOME:-/app/data/model-cache/huggingface}
      TORCH_HOME: ${TORCH_HOME:-/app/data/model-cache/torch}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
    expose:
      - "8000"
    volumes:
      - ${BENCHMARK_HOST_DATA_DIR:-./data/benchmarks}:/app/data/benchmarks:ro
      - ${MULTIMODAL_HOST_DATA_DIR:-./data/multimodal_demo}:/app/data/multimodal_demo:ro
      - ${SEMANTIC_INDEX_HOST_DIR:-./data/indexes}:/app/data/indexes
      - ${MODEL_CACHE_HOST_DIR:-./data/model-cache}:/app/data/model-cache
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_DEV_API_TARGET: ${VITE_DEV_API_TARGET:-http://backend:8000}
        VITE_USE_MOCK_SERVICES: ${VITE_USE_MOCK_SERVICES:-false}
        VITE_SHOW_DEV_AUTH_NOTE: ${VITE_SHOW_DEV_AUTH_NOTE:-false}
    container_name: debugsql-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_DEV_API_TARGET: ${VITE_DEV_API_TARGET:-http://backend:8000}
      VITE_SHOW_DEV_AUTH_NOTE: ${VITE_SHOW_DEV_AUTH_NOTE:-false}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
